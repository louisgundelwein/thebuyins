# iOS jobs run on our Mac minis through MINION; this workflow only submits them and reports the result.
name: MINION

on:
  pull_request:
  push:
    branches: [main]

env:
  MINION_URL: ${{ vars.MINION_URL }}

jobs:
  e2e:
    name: iOS E2E (simulator)
    # Fork PRs never reach the minis.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 100
    concurrency:
      group: e2e-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      # This key cannot unlock repository secrets in MINION.
      - run: .github/scripts/minion-run.sh "$GITHUB_HEAD_REF" "$HEAD_SHA" "bash scripts/minions/e2e.sh"
        env:
          MINION_API_KEY: ${{ secrets.MINION_API_KEY }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  testflight:
    name: TestFlight
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    # Only main can read this environment's key, which is the one allowed to use the App Store Connect secrets.
    environment: testflight
    concurrency:
      group: testflight
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      # Minutes since 1970: grows with every run and re-run, and is far above the builds uploaded by hand.
      # A push that lands while another upload waits replaces it; the newest main is what reaches TestFlight.
      - run: .github/scripts/minion-run.sh main "$GITHUB_SHA" "BUILD_NUMBER=$(( $(date +%s) / 60 )) bash scripts/minions/testflight.sh"
        env:
          MINION_API_KEY: ${{ secrets.MINION_DEPLOY_KEY }}
